[project]
name = "financeapp-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "iqbalkdev", email = "iqbalkresna.12@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.6",
    "pydantic[email]>=2.13.5",
    "pydantic-settings>=2.12.0",
    "pyjwt>=2.14.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "DTZ011", # local calendar dates are intentional for budgets/reports
]

[tool.pytest.ini_options]
testpaths = ["tests"]
